name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - core-service-foundation
      - "feat/**"
      - "fix/**"
      - "chore/**"

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: ubuntu-latest

    env:
      TOKEN_TAPER_ENV: test
      TOKEN_TAPER_LOG_LEVEL: info
      TOKEN_TAPER_LOG_FORMAT: json
      POSTGRES_DB: tokentaper
      POSTGRES_USER: tokentaper
      POSTGRES_PASSWORD: tokentaper
      TOKEN_TAPER_DATABASE_URL: jdbc:postgresql://postgres:5432/tokentaper
      TOKEN_TAPER_DATABASE_USER: tokentaper
      TOKEN_TAPER_DATABASE_PASSWORD: tokentaper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4.0
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      - name: Resolve dependencies
        run: clojure -P

      - name: Run tests
        run: clojure -M:test

      - name: Build uberjar
        run: clojure -T:build uber

      - name: Build Docker image
        run: docker build -t tokentaper:ci .

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Run migrations
        run: docker compose run --rm tokentaper-api migrate

      - name: Start API
        run: docker compose up -d --wait tokentaper-api

      - name: Run smoke checks
        run: ./scripts/smoke-v0.1.sh

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Compose
        if: always()
        run: docker compose down -v
